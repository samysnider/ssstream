<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stream">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Stream</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== WRITE SCREEN ========== -->
<div class="screen active" id="writeScreen">
  <!-- Focus mode switch: top right, where the word count used to be -->
  <div class="focus-bar">
    <div class="focus-bar-inner">
      <button class="focus-switch" type="button" role="switch" aria-checked="true" data-focus-switch title="Blur every word but the one you're on">
        <span class="focus-switch-label">Focus</span>
        <span class="focus-switch-track" aria-hidden="true"><span class="focus-switch-thumb"></span></span>
      </button>
    </div>
  </div>

  <div class="editor-container" id="editorContainer">
    <div class="editor-wrapper">
      <div class="editor" id="editor" contenteditable="true" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></div>
      <div class="blur-overlay" id="blurOverlay" aria-hidden="true"></div>
      <div class="custom-cursor" id="customCursor"></div>
      <div class="quote-placeholder" id="quotePlaceholder"></div>
    </div>
  </div>

  <div class="bottom-fade"></div>
  <div class="bottom-toolbar">
    <div class="bottom-toolbar-inner">
      <div class="toolbar-buttons">
        <button class="topbar-btn primary" id="newBtn">New</button>
        <button class="topbar-btn" id="saveBtn">Save</button>
        <button class="topbar-btn" id="notesBtn">Notes <span id="notesCount"></span></button>
        <button class="topbar-btn" id="pdfBtn" title="Export as PDF">PDF</button>
      </div>
      <span class="word-count" id="wordCount">0 words</span>
    </div>
  </div>
</div>

<!-- ========== NOTES LIST SCREEN ========== -->
<div class="screen" id="notesScreen">
  <div class="topbar always-visible">
    <div class="topbar-inner">
      <div class="topbar-left">
        <button class="topbar-btn" id="notesBackBtn">← Back</button>
      </div>
    </div>
  </div>
  <div class="notes-container">
    <ul class="archives-list" id="archivesList"></ul>
  </div>
</div>

<!-- ========== VIEW SCREEN ========== -->
<div class="screen" id="viewScreen">
  <div class="topbar" id="viewTopbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <button class="topbar-btn" id="backBtn">← Back</button>
        <span class="view-topbar-title" id="viewTitle"></span>
      </div>
      <div class="topbar-right">
        <button class="focus-switch" type="button" role="switch" aria-checked="true" data-focus-switch title="Blur every word but the one you're on">
          <span class="focus-switch-label">Focus</span>
          <span class="focus-switch-track" aria-hidden="true"><span class="focus-switch-thumb"></span></span>
        </button>
        <span class="word-count" id="viewWordCount">0 words</span>
        <button class="topbar-btn" id="exportBtn">Copy as .md</button>
        <button class="topbar-btn" id="viewPdfBtn" title="Export as PDF">PDF</button>
      </div>
    </div>
  </div>
  <div class="editor-container">
    <div class="editor-wrapper" id="viewEditorWrapper">
      <div class="editor" id="viewEditor" contenteditable="true" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></div>
      <div class="blur-overlay" id="viewBlurOverlay" aria-hidden="true"></div>
      <div class="custom-cursor" id="viewCustomCursor"></div>
    </div>
  </div>
  <div class="bottom-fade"></div>
</div>

<!-- Preview of a word's variations: hover its dots (tap them on a phone) -->
<div class="var-preview" id="varPreview" role="tooltip" hidden></div>

<!-- ========== VARIATIONS PANEL ========== -->
<!-- Opens from the left when you click a word: your own alternatives for it -->
<div class="var-layer" id="varLayer" hidden>
  <div class="var-backdrop" id="varBackdrop"></div>
  <aside class="var-panel" id="varPanel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="varWord">
    <div class="var-head">
      <span class="var-label">Variations</span>
      <button class="var-close" id="varClose" aria-label="Close" title="Close (Esc)">&times;</button>
    </div>
    <div class="var-word" id="varWord"></div>
    <div class="var-count" id="varCount"></div>
    <ul class="var-list" id="varList"></ul>
    <form class="var-add" id="varForm" autocomplete="off">
      <input class="var-input" id="varInput" type="text" placeholder="Add a variation" aria-label="Add a variation" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button class="topbar-btn" type="submit">Add</button>
    </form>
    <p class="var-hint" id="varHint">Choose a variation to use it in your text.</p>
  </aside>
</div>

<!-- What gets printed (and saved as PDF): the note, formatted -->
<article class="print-area" id="printArea" aria-hidden="true"></article>

<script src="script.js"></script>

</body>
</html>
